services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okei_fest}
      POSTGRES_USER: ${POSTGRES_USER:-okei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okei_secret_db_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okei} -d ${POSTGRES_DB:-okei_fest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-okei}:${POSTGRES_PASSWORD:-okei_secret_db_pass}@postgres:5432/${POSTGRES_DB:-okei_fest}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-jwt-key}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-okei-admin-2026}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:

